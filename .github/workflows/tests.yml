name: Testy

# Wszystkie testy po każdym pushu, w każdym branchu.
on:
  push:
    branches: ["**"]

permissions:
  contents: read

# Nowszy push do tego samego brancha anuluje trwający przebieg.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalacja uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Zależności (Python z .python-version, wersje z uv.lock)
        run: uv sync --locked

      - name: Cache przeglądarki Playwright
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Przeglądarka Playwright (headless) + zależności systemowe
        run: uv run playwright install --with-deps chromium-headless-shell

      - name: Testy
        run: uv run pytest -v
