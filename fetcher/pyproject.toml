[project]
name = "librus-fetcher"
version = "0.1.0"
description = "Pobieranie i cache'owanie wpisów z dziennika Librus Synergia"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    # wersja musi odpowiadać obrazowi mcr.microsoft.com/playwright/python w Dockerfile
    "playwright==1.65.0",
    "pydantic==2.14.3",
    "PyYAML==6.0.3",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.3",
    "markdownify==1.2.3",
]

[project.scripts]
librus-fetcher = "librus_fetcher.__main__:main"

[build-system]
requires = ["uv_build>=0.9.5,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "librus_fetcher"
module-root = ""
