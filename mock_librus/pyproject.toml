[project]
name = "librus-mock"
version = "0.1.0"
description = "Mock serwisu Librus Synergia serwujący zanonimizowane fixtures"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.163.1",
    "uvicorn==0.54.0",
    "python-multipart==0.0.33",
    "PyYAML==6.0.3",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.3",
]

[build-system]
requires = ["uv_build>=0.9.5,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mock_librus"
module-root = ""
