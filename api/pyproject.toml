[project]
name = "librus-api"
version = "0.1.0"
description = "API (FastAPI) udostępniające wpisy zapisane przez librus-fetcher"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.163.1",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["uv_build>=0.9.5,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "librus_api"
module-root = ""
